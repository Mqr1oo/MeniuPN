<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Meniuri Digitale &mdash; Piatra Neamț</title>
<meta name="description" content="Portal de meniuri digitale pentru restaurante din Piatra Neamț.">
<meta name="theme-color" content="#1c2b22">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;1,400;1,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">

<style>
  :root{
    --stone:#e8e2d2;
    --stone-deep:#dcd4bf;
    --pine:#1c2b22;
    --pine-2:#243527;
    --rust:#b5622a;
    --rust-light:#d98a4f;
    --slate:#5a5f52;
    --cream:#f6f2e6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'IBM Plex Sans',sans-serif;
    background:var(--stone);
    color:var(--pine);
    min-height:100vh;
    overflow-x:hidden;
  }
  h1,h2{font-family:'Newsreader',serif;text-transform:uppercase;font-weight:600;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  p, .go, .idx, .eyebrow, footer{text-transform:uppercase;}

  /* ===== Hero mountain signature ===== */
  .peak-wrap{
    position:relative;
    width:100%;
    height:46vh;
    min-height:280px;
    background:linear-gradient(180deg,#2a3d2e 0%,var(--pine) 55%,var(--pine-2) 100%);
    overflow:hidden;
    display:flex;
    align-items:flex-end;
    justify-content:center;
  }
  .peak-wrap svg{width:100%;height:100%;position:absolute;bottom:0;left:0;}
  .sky-dot{
    position:absolute;
    border-radius:50%;
    background:var(--rust-light);
    opacity:.55;
    filter:blur(1px);
    animation:twinkle 3.2s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{opacity:.25;transform:scale(1);}
    50%{opacity:.75;transform:scale(1.4);}
  }
  .peak-wrap svg path{
    animation:drift 12s ease-in-out infinite;
    transform-origin:center bottom;
  }
  .peak-wrap svg path:last-child{animation-duration:16s;animation-direction:reverse;}
  @keyframes drift{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-4px);}
  }
  .hero-copy{
    position:relative;
    z-index:5;
    text-align:center;
    color:var(--cream);
    padding-bottom:2.4rem;
    animation:rise .9s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:.72rem;
    letter-spacing:.32em;
    text-transform:uppercase;
    color:var(--rust-light);
    margin-bottom:.9rem;
  }
  .hero-copy h1{
    font-size:clamp(2.2rem,6vw,3.6rem);
    font-weight:500;
    margin:0 0 .5rem;
    line-height:1.05;
  }
  .hero-copy h1 em{
    font-style:italic;
    color:var(--rust-light);
  }
  .hero-copy p{
    font-size:.92rem;
    font-weight:600;
    letter-spacing:.02em;
    color:#cfd6c8;
    max-width:32rem;
    margin:0 auto;
  }

  /* ===== Main ===== */
  main{
    max-width:920px;
    margin:0 auto;
    padding:3rem 1.4rem 4rem;
  }
  #status{
    text-align:center;
    color:var(--slate);
    padding:2rem 0;
    text-transform:uppercase;
    font-weight:700;
    letter-spacing:.03em;
  }
  #status.error{color:var(--rust);}
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:1.1rem;
  }
  .card{
    position:relative;
    display:block;
    background:var(--cream);
    border:1px solid var(--stone-deep);
    border-radius:6px;
    padding:1.6rem 1.5rem;
    text-decoration:none;
    color:inherit;
    overflow:hidden;
    isolation:isolate;
    opacity:0;
    animation:rise .6s cubic-bezier(.2,.8,.2,1) forwards;
    transition:transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s;
  }
  .card:hover{
    transform:translateY(-4px);
    box-shadow:0 14px 30px -12px rgba(28,43,34,.35), 0 0 0 1px var(--rust);
    animation:glow 1.8s ease-in-out infinite;
  }
  @keyframes glow{
    0%,100%{box-shadow:0 14px 30px -12px rgba(28,43,34,.35), 0 0 0 1px var(--rust);}
    50%{box-shadow:0 14px 34px -10px rgba(181,98,42,.45), 0 0 0 1px var(--rust-light);}
  }
  .card::before{
    content:'';
    position:absolute;
    inset:0;
    background:linear-gradient(140deg,var(--pine),var(--pine-2));
    opacity:0;
    z-index:-1;
    transition:opacity .35s;
  }
  .card:hover::before{opacity:1;}
  .card .idx{
    font-family:'IBM Plex Mono',monospace;
    font-size:.68rem;
    letter-spacing:.18em;
    color:var(--rust);
    display:block;
    margin-bottom:.7rem;
    transition:color .35s;
  }
  .card:hover .idx{color:var(--rust-light);}
  .card h2{
    font-size:1.5rem;
    font-weight:600;
    margin:0 0 .4rem;
    text-transform:uppercase;
    transition:color .35s;
  }
  .card:hover h2{color:var(--cream);}
  .card p{
    font-size:.82rem;
    font-weight:700;
    letter-spacing:.02em;
    color:var(--slate);
    margin:0 0 1.3rem;
    transition:color .35s;
  }
  .card:hover p{color:#c9d2c4;}
  .go{
    display:inline-flex;
    align-items:center;
    gap:.45rem;
    font-size:.82rem;
    font-weight:700;
    letter-spacing:.03em;
    color:var(--pine);
    transition:color .35s;
  }
  .card:hover .go{color:var(--rust-light);}
  .go svg{width:15px;height:15px;transition:transform .35s;}
  .card:hover .go svg{transform:translateX(4px);}

  footer{
    text-align:center;
    color:var(--slate);
    font-size:.75rem;
    letter-spacing:.04em;
    padding:2rem 0 2.4rem;
  }

  @media (prefers-reduced-motion: reduce){
    .card,.hero-copy{animation:none;opacity:1;}
  }
</style>
</head>
<body>

<div class="peak-wrap">
  <div class="sky-dot" style="width:6px;height:6px;top:18%;left:22%;"></div>
  <div class="sky-dot" style="width:4px;height:4px;top:30%;left:68%;"></div>
  <div class="sky-dot" style="width:5px;height:5px;top:12%;left:80%;"></div>

  <!-- Signature: silhouette of Ceahlău / Piatra Neamț stone ridge -->
  <svg viewBox="0 0 1200 400" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0,400 L0,260 L140,180 L230,240 L340,120 L420,190 L520,60 L610,170 L700,100 L800,220 L900,150 L1000,230 L1080,170 L1200,260 L1200,400 Z"
          fill="#16241a" opacity="0.9"/>
    <path d="M0,400 L0,310 L120,250 L260,300 L360,210 L460,270 L560,160 L650,240 L760,190 L860,280 L980,220 L1100,290 L1200,250 L1200,400 Z"
          fill="#0f1c14"/>
  </svg>

  <div class="hero-copy">
    <div class="eyebrow">Neamț &middot; Moldova</div>
    <h1>Piatra Neamț <em>Gastronomie</em></h1>
    <p>Alege un restaurant pentru a descoperi meniul său digital, actualizat la zi.</p>
  </div>
</div>

<main>
  <div id="status">Se caută restaurante...</div>
  <div class="grid" id="restaurants-container"></div>
</main>

<footer>&copy; 2026 Meniuri Digitale &middot; Piatra Neamț, România</footer>

<script>
  const USERNAME = 'mqr1oo';
  const REPO = 'piatraneamt'; // schimbă dacă repo-ul are alt nume

  const container = document.getElementById('restaurants-container');
  const status = document.getElementById('status');

  async function fetchRestaurants(){
    try{
      const res = await fetch(`https://api.github.com/repos/${USERNAME}/${REPO}/contents/`);
      if(!res.ok) throw new Error('GitHub API error');
      const data = await res.json();
      const folders = data.filter(i => i.type === 'dir' && i.name !== '.git' && i.name !== 'images' && i.name !== 'icons');

      status.style.display = 'none';

      if(folders.length === 0){
        status.style.display = 'block';
        status.textContent = 'Niciun restaurant disponibil momentan.';
        return;
      }

      folders.forEach((folder, i) => {
        const name = folder.name;
        const title = name.charAt(0).toUpperCase() + name.slice(1);
        const a = document.createElement('a');
        a.href = `./${name}/`;
        a.className = 'card';
        a.style.animationDelay = `${i * 90}ms`;
        a.innerHTML = `
          <span class="idx">${String(i+1).padStart(2,'0')} / RESTAURANT</span>
          <h2>${title}</h2>
          <p>Descoperă meniul digital ${title}.</p>
          <span class="go">Vezi meniul
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"/></svg>
          </span>`;
        container.appendChild(a);
      });

      const io = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if(entry.isIntersecting){
            entry.target.style.animationPlayState = 'running';
            io.unobserve(entry.target);
          }
        });
      }, {threshold: 0.15});
      document.querySelectorAll('.card').forEach(card => {
        card.style.animationPlayState = 'paused';
        io.observe(card);
      });
    }catch(err){
      console.error(err);
      status.textContent = 'Eroare la încărcarea listei de restaurante.';
      status.classList.add('error');
    }
  }
  fetchRestaurants();

  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW registration failed', e));
    });
  }
</script>
</body>
</html>
